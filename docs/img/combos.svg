<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title id="t">Os três combos temporais</title>
  <desc id="d">Crossfire: nave e eco acertam o mesmo alvo. Reflect Chain: um projétil ricocheteia em escudos em sequência. Synchronized Strike: dois pontos fracos do chefe atingidos quase ao mesmo tempo.</desc>
  <style>
    .h{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
    .s{font:400 11.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d4f2}
    .r{font:600 11.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#3fe0a0}
    .n{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5d6f9e}
  </style>
  <defs>
    <path id="ship" d="M12 0 L-8 -8 L-4 0 L-8 8 Z"/>
    <g id="foe"><path d="M0 -8 L8 0 L0 8 L-8 0 Z"/></g>
    <radialGradient id="boom"><stop offset="0" stop-color="#fff3d6"/><stop offset=".4" stop-color="#ffb35c"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="6" fill="#ff4d6d" fill-opacity=".5"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a3d"/></marker>
  </defs>
  <rect width="800" height="300" rx="14" fill="#0a0f1f"/>

  <!-- panel frames: x = 148,326,504 -->
  <g fill="#0f1830" stroke="#1e2b52">
    <rect x="148" y="10" width="148" height="280" rx="10"/><rect x="326" y="10" width="148" height="280" rx="10"/>
    <rect x="504" y="10" width="148" height="280" rx="10"/>
  </g>

  <!-- 1 Crossfire -->
  <g transform="translate(148 10)">
    <text x="12" y="24" class="n">01</text><text x="30" y="24" class="h" fill="#ff8a3d">CROSSFIRE</text>
    <rect x="10" y="38" width="128" height="132" rx="6" fill="#0a0f1f"/>
    <use href="#ship" transform="translate(30 66)" fill="#b18cff" fill-opacity=".35" stroke="#d9c7ff"/>
    <use href="#ship" transform="translate(30 140)" fill="#36e2ff"/>
    <path d="M46 70 L104 98" stroke="#b18cff" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
    <path d="M46 136 L104 110" stroke="#36e2ff" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
    <circle cx="114" cy="104" r="22" fill="url(#boom)"/>
    <use href="#foe" x="114" y="104" fill="#ff8a3d" stroke="#ffd2a8"/>
    <text x="12" y="194" class="s">Nave e eco acertam o</text>
    <text x="12" y="210" class="s">mesmo alvo numa</text>
    <text x="12" y="226" class="s">janela curta</text>
    <path d="M12 246H136" stroke="#1e2b52"/>
    <text x="12" y="266" class="r">→ dano adicional</text>
  </g>

  <!-- 2 Reflect Chain -->
  <g transform="translate(326 10)">
    <text x="12" y="24" class="n">02</text><text x="30" y="24" class="h" fill="#ff8a3d">REFLECT CHAIN</text>
    <rect x="10" y="38" width="128" height="132" rx="6" fill="#0a0f1f"/>
    <g stroke="#b18cff" stroke-width="4" stroke-linecap="round"><path d="M46 156 L66 146"/><path d="M86 52 L104 62"/></g>
    <path d="M18 56 L56 150 L94 58 L122 132" fill="none" stroke="#ff8a3d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <circle cx="18" cy="56" r="5" fill="#ff8a3d"/>
    <circle cx="124" cy="138" r="20" fill="url(#boom)"/>
    <circle cx="124" cy="138" r="7" fill="#ff8a3d" stroke="#ffd2a8"/>
    <text x="128" y="52" class="n" text-anchor="end" fill="#b18cff">ESCUDOS</text>
    <text x="12" y="194" class="s">Um projétil ricocheteia</text>
    <text x="12" y="210" class="s">em escudos postos</text>
    <text x="12" y="226" class="s">em sequência</text>
    <path d="M12 246H136" stroke="#1e2b52"/>
    <text x="12" y="266" class="r">→ dano elevado</text>
  </g>

  <!-- 3 Synchronized Strike -->
  <g transform="translate(504 10)">
    <text x="12" y="24" class="n">03</text><text x="30" y="24" class="h" fill="#ff8a3d">SYNC STRIKE</text>
    <rect x="10" y="38" width="128" height="132" rx="6" fill="#0a0f1f"/>
    <path d="M138 44 H108 Q92 44 92 60 V148 Q92 164 108 164 H138" fill="#22140f" stroke="#ff8a3d"/>
    <path d="M86 70 A46 46 0 0 0 86 138" fill="none" stroke="#36e2ff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="106" cy="72" r="7" fill="#ff4d6d" stroke="#ffd2a8"/><circle cx="106" cy="136" r="7" fill="#ff4d6d" stroke="#ffd2a8"/>
    <use href="#ship" transform="translate(28 72)" fill="#36e2ff"/>
    <use href="#ship" transform="translate(28 136)" fill="#b18cff" fill-opacity=".35" stroke="#d9c7ff"/>
    <path d="M44 72 H92" stroke="#36e2ff" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
    <path d="M44 136 H92" stroke="#b18cff" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
    <text x="60" y="108" class="n" text-anchor="middle" fill="#8a9bc4">JUNTOS</text>
    <text x="12" y="194" class="s">Dois pontos fracos</text>
    <text x="12" y="210" class="s">atingidos quase ao</text>
    <text x="12" y="226" class="s">mesmo tempo</text>
    <path d="M12 246H136" stroke="#1e2b52"/>
    <text x="12" y="266" class="r">→ escudo desativado</text>
  </g>
</svg>
