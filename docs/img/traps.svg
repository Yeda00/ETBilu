<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="t d">
  <title id="t">Armadilhas e interação temporal</title>
  <desc id="d">Laser gate: o eco segura um interruptor que desliga uma barreira enquanto a nave passa. Laser rotativo: o eco atrai inimigos para a linha de fogo. Campo de minas: a nave detona quando os inimigos passam pela rota do eco. Barreiras móveis: o eco mantém o mecanismo aberto.</desc>
  <style>
    .h{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
    .s{font:400 11.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d4f2}
    .e{font:400 11.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#d9c7ff}
    .n{font:700 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5d6f9e}
  </style>
  <defs>
    <path id="ship" d="M11 0 L-7 -7 L-3.5 0 L-7 7 Z"/>
    <path id="foe" d="M0 -6 L6 0 L0 6 L-6 0 Z"/>
    <g id="mine"><circle r="5" fill="#ff4d6d"/><path d="M0 -8V-5M0 5V8M-8 0H-5M5 0H8" stroke="#ff4d6d" stroke-width="1.6"/></g>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a9bc4"/></marker>
  </defs>
  <rect width="800" height="270" rx="14" fill="#0a0f1f"/>
  <g fill="#0f1830" stroke="#1e2b52"><rect x="10" y="10" width="188" height="250" rx="10"/><rect x="204" y="10" width="188" height="250" rx="10"/><rect x="398" y="10" width="188" height="250" rx="10"/><rect x="592" y="10" width="188" height="250" rx="10"/></g>

  <!-- 1 Laser gate -->
  <g transform="translate(10 10)">
    <text x="12" y="24" class="h" fill="#ff4d6d">LASER GATE</text>
    <rect x="10" y="36" width="168" height="112" rx="6" fill="#0a0f1f"/>
    <rect x="22" y="44" width="30" height="8" rx="2" fill="#3fe0a0"/>
    <text x="58" y="52" class="n" fill="#3fe0a0">INTERRUPTOR</text>
    <use href="#ship" transform="translate(37 64) rotate(-90)" fill="#b18cff" fill-opacity=".35" stroke="#d9c7ff"/>
    <path d="M37 52 V44 M37 48 C60 48 90 70 110 70" fill="none" stroke="#3fe0a0" stroke-opacity=".5" stroke-dasharray="2 3"/>
    <path d="M110 64 V132" stroke="#5d6f9e" stroke-width="2" stroke-dasharray="3 5"/>
    <text x="110" y="145" class="n" text-anchor="middle">OFF</text>
    <path d="M150 64 V132" stroke="#ff4d6d" stroke-width="3"/>
    <rect x="146" y="62" width="8" height="4" fill="#ff4d6d"/><rect x="146" y="130" width="8" height="4" fill="#ff4d6d"/>
    <text x="150" y="145" class="n" text-anchor="middle" fill="#ff4d6d">CICLO</text>
    <use href="#ship" transform="translate(112 108)" fill="#36e2ff"/>
    <path d="M70 108 H96" stroke="#36e2ff" stroke-opacity=".5" stroke-dasharray="3 3"/>
    <text x="12" y="172" class="s">Barreiras ligam e desligam</text>
    <text x="12" y="188" class="s">em ciclos.</text>
    <text x="12" y="214" class="h" fill="#b18cff">ECO</text>
    <text x="12" y="230" class="e">segura o interruptor;</text>
    <text x="12" y="246" class="e">a nave atravessa</text>
  </g>

  <!-- 2 Laser rotativo -->
  <g transform="translate(204 10)">
    <text x="12" y="24" class="h" fill="#ff4d6d">LASER ROTATIVO</text>
    <rect x="10" y="36" width="168" height="112" rx="6" fill="#0a0f1f"/>
    <path d="M160 92 L26 64 L26 80 Z" fill="#ff4d6d" fill-opacity=".35"/>
    <path d="M160 92 L26 72" stroke="#ff4d6d" stroke-width="2"/>
    <path d="M60 120 A104 104 0 0 1 58 52" fill="none" stroke="#8a9bc4" stroke-width="1.2" marker-end="url(#a)" transform="translate(4 0)"/>
    <circle cx="160" cy="92" r="9" fill="#2a1016" stroke="#ff4d6d" stroke-width="2"/>
    <use href="#ship" transform="translate(60 112)" fill="#b18cff" fill-opacity=".35" stroke="#d9c7ff"/>
    <g fill="#ff8a3d"><use href="#foe" x="96" y="80"/><use href="#foe" x="114" y="86"/></g>
    <path d="M70 108 L92 86" stroke="#b18cff" stroke-opacity=".5" stroke-dasharray="2 3"/>
    <use href="#ship" transform="translate(36 132)" fill="#36e2ff"/>
    <text x="12" y="172" class="s">Um feixe varre a área: mude</text>
    <text x="12" y="188" class="s">de altitude.</text>
    <text x="12" y="214" class="h" fill="#b18cff">ECO</text>
    <text x="12" y="230" class="e">atrai os inimigos para a</text>
    <text x="12" y="246" class="e">linha de fogo</text>
  </g>

  <!-- 3 Campo de minas -->
  <g transform="translate(398 10)">
    <text x="12" y="24" class="h" fill="#ff4d6d">CAMPO DE MINAS</text>
    <rect x="10" y="36" width="168" height="112" rx="6" fill="#0a0f1f"/>
    <path d="M60 96 C90 70 120 70 168 66" fill="none" stroke="#b18cff" stroke-opacity=".25" stroke-width="22" stroke-linecap="round"/>
    <path d="M60 96 C90 70 120 70 168 66" fill="none" stroke="#b18cff" stroke-opacity=".6" stroke-dasharray="3 4"/>
    <use href="#mine" x="98" y="60"/><use href="#mine" x="134" y="82"/><use href="#mine" x="80" y="124"/><use href="#mine" x="148" y="124"/><use href="#mine" x="112" y="104"/>
    <g fill="#ff8a3d"><use href="#foe" x="120" y="72"/><use href="#foe" x="142" y="66"/></g>
    <use href="#ship" transform="translate(30 132)" fill="#36e2ff"/>
    <path d="M44 128 L90 112" stroke="#36e2ff" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="26" y="52" class="n" fill="#36e2ff">DETONAR</text>
    <text x="12" y="172" class="s">Minas explodem ao contato</text>
    <text x="12" y="188" class="s">ou após um gatilho.</text>
    <text x="12" y="214" class="h" fill="#b18cff">ECO</text>
    <text x="12" y="230" class="e">marca a rota; a nave detona</text>
    <text x="12" y="246" class="e">quando os inimigos passam</text>
  </g>

  <!-- 4 Barreiras móveis -->
  <g transform="translate(592 10)">
    <text x="12" y="24" class="h" fill="#ff4d6d">BARREIRAS MÓVEIS</text>
    <rect x="10" y="36" width="168" height="112" rx="6" fill="#0a0f1f"/>
    <rect x="100" y="36" width="26" height="40" fill="#2a1016" stroke="#ff8a3d"/>
    <rect x="100" y="108" width="26" height="40" fill="#2a1016" stroke="#ff8a3d"/>
    <path d="M113 70 V50 M113 114 V134" stroke="#ff8a3d" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="32" y="128" width="26" height="8" rx="2" fill="#3fe0a0"/>
    <use href="#ship" transform="translate(45 120) rotate(90)" fill="#b18cff" fill-opacity=".35" stroke="#d9c7ff"/>
    <path d="M58 132 C80 132 90 92 100 92" fill="none" stroke="#3fe0a0" stroke-opacity=".5" stroke-dasharray="2 3"/>
    <use href="#ship" transform="translate(146 92)" fill="#36e2ff"/>
    <path d="M60 92 H130" stroke="#36e2ff" stroke-opacity=".5" stroke-dasharray="3 3"/>
    <text x="113" y="96" class="n" text-anchor="middle" fill="#3fe0a0">ABERTO</text>
    <text x="12" y="172" class="s">Abrem e fecham rotas;</text>
    <text x="12" y="188" class="s">exigem precisão.</text>
    <text x="12" y="214" class="h" fill="#b18cff">ECO</text>
    <text x="12" y="230" class="e">mantém o mecanismo aberto:</text>
    <text x="12" y="246" class="e">uma janela de passagem</text>
  </g>
</svg>
