<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title id="t">Ciclo de gravação e reprodução</title>
  <desc id="d">Linha do tempo de cinco segundos. Enquanto Shift está pressionado, o jogo grava 20 amostras de posição e rotação por segundo e uma lista de eventos: tiros, mina e pulso. Ao apertar E, o eco reproduz os mesmos eventos na mesma ordem.</desc>
  <style>
    .h{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
    .m{font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5d6f9e}
    .s{font:400 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d4f2}
  </style>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#141e3a" stroke-width="1"/></pattern>
    <pattern id="ticks" x="150" width="5.8" height="24" patternUnits="userSpaceOnUse"><rect width="1.6" height="24" fill="#36e2ff" fill-opacity=".55"/></pattern>
    <pattern id="ticksV" x="150" width="5.8" height="24" patternUnits="userSpaceOnUse"><rect width="1.6" height="24" fill="#b18cff" fill-opacity=".45"/></pattern>
    <g id="shot"><rect x="-6" y="-2" width="12" height="4" rx="2"/></g>
    <g id="mine"><circle r="6"/><path d="M0 -9V-6M0 6V9M-9 0H-6M6 0H9" stroke-width="2"/></g>
    <g id="pulse"><circle r="4"/><circle r="8" fill="none" stroke-width="1.5"/></g>
  </defs>
  <rect width="800" height="330" rx="14" fill="#0a0f1f"/>
  <rect width="800" height="330" rx="14" fill="url(#g)"/>

  <!-- grid lines per second (x = 150 + 116 t) -->
  <g stroke="#1e2b52" stroke-width="1">
    <path d="M150 44V196M266 44V196M382 44V196M498 44V196M614 44V196M730 44V196"/>
    <path d="M150 224V276M266 224V276M382 224V276M498 224V276M614 224V276M730 224V276" stroke-dasharray="2 4"/>
  </g>

  <!-- row labels -->
  <text x="24" y="66" class="h" fill="#36e2ff">SHIFT</text>
  <text x="24" y="80" class="m">segurar = gravar</text>
  <text x="24" y="112" class="h" fill="#36e2ff">AMOSTRAS</text>
  <text x="24" y="126" class="m">posição, rotação</text>
  <text x="24" y="158" class="h" fill="#36e2ff">EVENTOS</text>
  <text x="24" y="172" class="m">tiros, gadgets</text>

  <!-- Shift bar -->
  <rect x="150" y="54" width="580" height="26" rx="6" fill="#36e2ff" fill-opacity=".14" stroke="#36e2ff"/>
  <circle cx="166" cy="67" r="5" fill="#ff4d6d"/>
  <text x="180" y="71" class="s" fill="#bff6ff">gravando — o indicador mostra o tempo restante</text>
  <text x="724" y="71" class="h" fill="#36e2ff" text-anchor="end">5,0 s MÁX.</text>

  <!-- samples -->
  <rect x="150" y="100" width="580" height="24" fill="url(#ticks)"/>
  <text x="736" y="117" class="m">20/s</text>

  <!-- events -->
  <path d="M150 156H730" stroke="#24345f" stroke-width="2"/>
  <g fill="#36e2ff">
    <use href="#shot" x="219.6" y="156"/><use href="#shot" x="277.6" y="156"/><use href="#shot" x="335.6" y="156"/>
    <use href="#shot" x="521.2" y="156"/><use href="#shot" x="556" y="156"/>
  </g>
  <g fill="#ffc94d" stroke="#ffc94d"><use href="#mine" x="428.4" y="156"/></g>
  <g fill="#3fe0a0" stroke="#3fe0a0"><use href="#pulse" x="660.4" y="156"/></g>

  <!-- axis -->
  <g class="m" text-anchor="middle">
    <text x="150" y="194">0 s</text><text x="266" y="194">1 s</text><text x="382" y="194">2 s</text>
    <text x="498" y="194">3 s</text><text x="614" y="194">4 s</text><text x="730" y="194">5 s</text>
  </g>

  <!-- release + invoke -->
  <path d="M24 210H776" stroke="#1e2b52"/>
  <rect x="300" y="200" width="200" height="20" rx="10" fill="#0a0f1f" stroke="#2a3a63"/>
  <text x="400" y="214" class="m" text-anchor="middle" fill="#8a9bc4">soltar Shift · apertar E</text>

  <text x="24" y="246" class="h" fill="#b18cff">ECO</text>
  <text x="24" y="260" class="m">reprodução</text>
  <rect x="150" y="234" width="580" height="30" rx="6" fill="#b18cff" fill-opacity=".1" stroke="#b18cff" stroke-dasharray="5 3"/>
  <rect x="150" y="234" width="580" height="8" fill="url(#ticksV)" opacity=".7"/>
  <g fill="#b18cff">
    <use href="#shot" x="219.6" y="254"/><use href="#shot" x="277.6" y="254"/><use href="#shot" x="335.6" y="254"/>
    <use href="#shot" x="521.2" y="254"/><use href="#shot" x="556" y="254"/>
  </g>
  <g fill="#b18cff" stroke="#b18cff"><use href="#mine" x="428.4" y="254"/><use href="#pulse" x="660.4" y="254"/></g>

  <!-- legend / rules -->
  <g transform="translate(30 300)">
    <g fill="#36e2ff"><use href="#shot" x="6" y="0"/></g><text x="18" y="4" class="s">tiro</text>
    <g fill="#ffc94d" stroke="#ffc94d"><use href="#mine" x="66" y="0"/></g><text x="80" y="4" class="s">mina</text>
    <g fill="#3fe0a0" stroke="#3fe0a0"><use href="#pulse" x="130" y="0"/></g><text x="144" y="4" class="s">pulso</text>
    <text x="200" y="4" class="s" fill="#8a9bc4">· posições interpoladas · cada evento dispara uma vez · o mundo não rebobina</text>
  </g>
</svg>
