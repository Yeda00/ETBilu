<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="t d">
  <title id="t">Encontro 1 — linha do tempo das ondas</title>
  <desc id="d">De 0:00 a 0:10 só obstáculos; de 0:10 a 0:25 três drones em fila; de 0:25 a 0:40 drones em duas alturas; de 0:40 a 1:00 ondulantes; de 1:00 a 1:20 torreta e drones.</desc>
  <style>
    .h{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
    .m{font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8a9bc4}
    .s{font:400 11.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d4f2}
  </style>
  <defs>
    <path id="drone" d="M-7 0 L3 -6 L7 -6 L4 0 L7 6 L3 6 Z"/>
    <path id="wave" d="M-6 0 L0 -5 L6 0 L0 5 Z"/>
  </defs>
  <rect width="800" height="230" rx="14" fill="#0a0f1f"/>
  <text x="40" y="28" class="h" fill="#5d6f9e">ENCONTRO 1 · PRIMEIRO CICLO</text>
  <text x="760" y="28" class="h" fill="#5d6f9e" text-anchor="end">VALORES DE PARTIDA PARA TESTE</text>

  <!-- blocks: 9 px per second, x0 = 40 -->
  <g stroke-width="1">
    <rect x="40" y="40" width="88" height="62" rx="6" fill="#111a33" stroke="#2a3a63"/>
    <rect x="132" y="40" width="131" height="62" rx="6" fill="#22140f" stroke="#ff8a3d" stroke-opacity=".6"/>
    <rect x="267" y="40" width="131" height="62" rx="6" fill="#22140f" stroke="#ff8a3d" stroke-opacity=".6"/>
    <rect x="402" y="40" width="176" height="62" rx="6" fill="#22140f" stroke="#ff8a3d" stroke-opacity=".6"/>
    <rect x="582" y="40" width="178" height="62" rx="6" fill="#2a1016" stroke="#ff4d6d" stroke-opacity=".7"/>
  </g>
  <g class="h">
    <text x="48" y="56" fill="#8a9bc4">OBSTÁCULOS</text>
    <text x="140" y="56" fill="#ff8a3d">3 DRONES EM FILA</text>
    <text x="275" y="56" fill="#ff8a3d">DRONES · 2 ALTURAS</text>
    <text x="410" y="56" fill="#ff8a3d">ONDULANTES</text>
    <text x="590" y="56" fill="#ff4d6d">TORRETA + DRONES</text>
  </g>
  <!-- icons -->
  <g fill="#3a4a78"><rect x="62" y="70" width="14" height="24" rx="2"/><rect x="92" y="80" width="18" height="14" rx="2"/></g>
  <g fill="#ff8a3d"><use href="#drone" x="176" y="80"/><use href="#drone" x="198" y="80"/><use href="#drone" x="220" y="80"/></g>
  <g fill="#ff8a3d"><use href="#drone" x="300" y="72"/><use href="#drone" x="324" y="72"/><use href="#drone" x="348" y="90"/><use href="#drone" x="372" y="90"/></g>
  <path d="M420 80 C440 64 450 64 470 80 S500 96 520 80 S550 64 566 76" fill="none" stroke="#ff8a3d" stroke-opacity=".4" stroke-dasharray="3 4"/>
  <g fill="#ff8a3d"><use href="#wave" x="445" y="68"/><use href="#wave" x="470" y="80"/><use href="#wave" x="495" y="92"/><use href="#wave" x="520" y="80"/></g>
  <g transform="translate(616 96)"><path d="M-12 0 V-7 Q-12 -13 -6 -13 H6 Q12 -13 12 -7 V0 Z" fill="#ff4d6d"/><path d="M-3 -11 L-14 -22" stroke="#ff4d6d" stroke-width="4" stroke-linecap="round"/></g>
  <g fill="#ff8a3d"><use href="#drone" x="672" y="72"/><use href="#drone" x="696" y="72"/><use href="#drone" x="720" y="72"/></g>

  <!-- echo marker -->
  <path d="M267 36 V108" stroke="#b18cff" stroke-dasharray="3 3"/>

  <!-- axis -->
  <path d="M40 112 H760" stroke="#2a3a63"/>
  <g stroke="#2a3a63"><path d="M40 108V116M130 108V116M265 108V116M400 108V116M580 108V116M760 108V116"/></g>
  <g class="m" text-anchor="middle"><text x="44" y="130" text-anchor="start">0:00</text><text x="130" y="130">0:10</text><text x="265" y="130">0:25</text><text x="400" y="130">0:40</text><text x="580" y="130">1:00</text><text x="756" y="130" text-anchor="end">1:20</text></g>

  <!-- design goals -->
  <text x="40" y="152" class="h" fill="#5d6f9e">OBJETIVO</text>
  <g class="s">
    <text x="40" y="172">Aprender</text><text x="40" y="188">movimento</text><text x="40" y="204">e tiro</text>
    <text x="134" y="172">Primeiros alvos,</text><text x="134" y="188">sem pressão</text>
    <text x="269" y="172" fill="#d9c7ff">Gravar uma rota e</text><text x="269" y="188" fill="#d9c7ff">deixar o eco cobrir</text><text x="269" y="204" fill="#d9c7ff">um nível</text>
    <text x="404" y="172">Ler o padrão e atacar</text><text x="404" y="188">com nave e eco juntos</text>
    <text x="584" y="172">Dividir as tarefas</text><text x="584" y="188">entre nave e eco</text>
  </g>
  <text x="272" y="220" class="h" fill="#b18cff">▲ PRIMEIRO MOTIVO PARA GRAVAR</text>
</svg>
