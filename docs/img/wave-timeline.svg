<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="t d">
  <title id="t">Encontro 1 — linha do tempo das ondas</title>
  <desc id="d">De 0:00 a 0:10 voo livre; de 0:10 a 0:25 caças em fila, no alto e embaixo; de 0:25 a 0:35 o primeiro artilheiro; de 0:35 a 0:44 caças em dois níveis; de 0:44 a 0:55 dois artilheiros, em cima e embaixo; de 0:55 a 1:10 caças pelo meio e um artilheiro com escolta; de 1:10 a 1:20 caças finais em dois níveis.</desc>
  <style>
    .h{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}
    .m{font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8a9bc4}
    .s{font:400 11px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d4f2}
  </style>
  <defs>
    <path id="f" d="M-7 0 L3 -5 L7 -2 L3 0 L7 2 L3 5 Z"/>
    <g id="g"><path d="M-4 0 L3 -5 L8 0 L3 5 Z"/><path d="M-11 -7 L-1 -4 M-11 7 L-1 4" fill="none" stroke-width="2" stroke-linecap="round"/></g>
  </defs>
  <rect width="800" height="230" rx="14" fill="#0a0f1f"/>
  <text x="40" y="28" class="h" fill="#5d6f9e">ENCONTRO 1 · PRIMEIRO CICLO</text>
  <text x="760" y="28" class="h" fill="#5d6f9e" text-anchor="end">VALORES DE PARTIDA PARA TESTE</text>

  <!-- blocks: 9 px per second, x0 = 40 -->
  <g stroke-width="1">
    <rect x="40" y="40" width="88" height="62" rx="6" fill="#111a33" stroke="#2a3a63"/>
    <rect x="132" y="40" width="131" height="62" rx="6" fill="#22140f" stroke="#ff8a3d" stroke-opacity=".6"/>
    <rect x="267" y="40" width="86" height="62" rx="6" fill="#2a1016" stroke="#ff4d6d" stroke-opacity=".7"/>
    <rect x="357" y="40" width="77" height="62" rx="6" fill="#22140f" stroke="#ff8a3d" stroke-opacity=".6"/>
    <rect x="438" y="40" width="95" height="62" rx="6" fill="#2a1016" stroke="#ff4d6d" stroke-opacity=".7"/>
    <rect x="537" y="40" width="131" height="62" rx="6" fill="#22140f" stroke="#ff8a3d" stroke-opacity=".6"/>
    <rect x="672" y="40" width="88" height="62" rx="6" fill="#22140f" stroke="#ff8a3d" stroke-opacity=".6"/>
  </g>
  <g class="h">
    <text x="48" y="56" fill="#8a9bc4">VOO LIVRE</text>
    <text x="140" y="56" fill="#ff8a3d">CAÇAS EM FILA</text>
    <text x="275" y="56" fill="#ff4d6d">ARTILHEIRO</text>
    <text x="365" y="56" fill="#ff8a3d">2 NÍVEIS</text>
    <text x="446" y="56" fill="#ff4d6d">ARTILHEIROS</text>
    <text x="545" y="56" fill="#ff8a3d">CAÇAS + ESCOLTA</text>
    <text x="680" y="56" fill="#ff8a3d">FINAL</text>
  </g>
  <!-- icons -->
  <path d="M60 84 h40" stroke="#3a4a78" stroke-dasharray="3 3"/>
  <g fill="#ff8a3d"><use href="#f" x="160" y="72"/><use href="#f" x="178" y="72"/><use href="#f" x="196" y="72"/><use href="#f" x="200" y="90"/><use href="#f" x="218" y="90"/><use href="#f" x="236" y="90"/></g>
  <g fill="#ff4d6d" stroke="#ff4d6d"><use href="#g" x="312" y="82"/></g>
  <g fill="#ff8a3d"><use href="#f" x="378" y="70"/><use href="#f" x="396" y="70"/><use href="#f" x="388" y="92"/><use href="#f" x="406" y="92"/></g>
  <g fill="#ff4d6d" stroke="#ff4d6d"><use href="#g" x="488" y="70"/><use href="#g" x="488" y="93"/></g>
  <g fill="#ff8a3d"><use href="#f" x="556" y="80"/><use href="#f" x="574" y="80"/><use href="#f" x="592" y="80"/><use href="#f" x="632" y="68"/><use href="#f" x="650" y="68"/></g>
  <g fill="#ff4d6d" stroke="#ff4d6d"><use href="#g" x="640" y="92"/></g>
  <g fill="#ff8a3d"><use href="#f" x="694" y="70"/><use href="#f" x="712" y="70"/><use href="#f" x="704" y="92"/><use href="#f" x="722" y="92"/></g>

  <!-- echo marker -->
  <path d="M265 36 V108" stroke="#b18cff" stroke-dasharray="3 3"/>

  <!-- axis -->
  <path d="M40 112 H760" stroke="#2a3a63"/>
  <g stroke="#2a3a63"><path d="M40 108V116M130 108V116M265 108V116M355 108V116M436 108V116M535 108V116M670 108V116M760 108V116"/></g>
  <g class="m" text-anchor="middle"><text x="44" y="130" text-anchor="start">0:00</text><text x="130" y="130">0:10</text><text x="265" y="130">0:25</text><text x="355" y="130">0:35</text><text x="436" y="130">0:44</text><text x="535" y="130">0:55</text><text x="670" y="130">1:10</text><text x="756" y="130" text-anchor="end">1:20</text></g>

  <!-- design goals -->
  <text x="40" y="152" class="h" fill="#5d6f9e">OBJETIVO</text>
  <g class="s">
    <text x="40" y="172">Mover, atirar</text><text x="40" y="187">e gravar</text>
    <text x="134" y="172">Primeiros alvos;</text><text x="134" y="187">sair da linha do</text><text x="134" y="202">tiro mirado</text>
    <text x="269" y="172" fill="#d9c7ff">Gravar o tiro,</text><text x="269" y="187" fill="#d9c7ff">cruzar com</text><text x="269" y="202" fill="#d9c7ff">o eco</text>
    <text x="359" y="172">Eco cobre</text><text x="359" y="187">um nível</text>
    <text x="440" y="172">Dividir as</text><text x="440" y="187">tarefas entre</text><text x="440" y="202">nave e eco</text>
    <text x="539" y="172">Ler e priorizar</text><text x="539" y="187">os alvos</text>
    <text x="674" y="172">Fechar antes</text><text x="674" y="187">do corredor</text>
  </g>
  <text x="272" y="220" class="h" fill="#b18cff">▲ PRIMEIRO ALVO PARA CROSSFIRE</text>
</svg>
