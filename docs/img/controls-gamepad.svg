<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="t d">
  <title id="t">Mapa do controle (gamepad)</title>
  <desc id="d">Stick esquerdo move a nave. Stick direito mira. Gatilho direito (RT) atira. Gatilho esquerdo (LT), segurado, grava. Botão RB invoca o eco. Botão LB usa o gadget. Start pausa.</desc>
  <style>
    .k{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .s{font:400 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d4f2}
    .n{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5d6f9e;letter-spacing:.06em}
  </style>
  <rect width="800" height="270" rx="14" fill="#0a0f1f"/>

  <!-- body -->
  <rect x="230" y="80" width="340" height="120" rx="56" fill="#111a33" stroke="#24345f"/>
  <ellipse cx="262" cy="196" rx="42" ry="56" fill="#111a33" stroke="#24345f"/>
  <ellipse cx="538" cy="196" rx="42" ry="56" fill="#111a33" stroke="#24345f"/>
  <rect x="236" y="100" width="328" height="86" rx="40" fill="#111a33"/>

  <!-- triggers and shoulders -->
  <rect x="236" y="34" width="96" height="30" rx="9" fill="#2a1016" stroke="#ff4d6d" stroke-width="1.5"/>
  <text x="284" y="54" class="k" fill="#ff8fa3" text-anchor="middle">LT</text>
  <rect x="468" y="34" width="96" height="30" rx="9" fill="#0d2633" stroke="#36e2ff" stroke-width="1.5"/>
  <text x="516" y="54" class="k" fill="#36e2ff" text-anchor="middle">RT</text>
  <rect x="236" y="68" width="96" height="16" rx="7" fill="#2a2210" stroke="#ffc94d" stroke-width="1.5"/>
  <text x="284" y="80" class="k" fill="#ffc94d" text-anchor="middle" font-size="11">LB</text>
  <rect x="468" y="68" width="96" height="16" rx="7" fill="#1c1640" stroke="#b18cff" stroke-width="1.5"/>
  <text x="516" y="80" class="k" fill="#b18cff" text-anchor="middle" font-size="11">RB</text>

  <!-- sticks -->
  <circle cx="300" cy="128" r="26" fill="#0d2633" stroke="#36e2ff" stroke-width="1.5"/>
  <circle cx="300" cy="128" r="12" fill="#36e2ff" fill-opacity=".35"/>
  <circle cx="470" cy="164" r="26" fill="#0d2633" stroke="#36e2ff" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="470" cy="164" r="12" fill="#36e2ff" fill-opacity=".35"/>

  <!-- d-pad and face buttons (not used) -->
  <g fill="#1a2547" stroke="#24345f"><rect x="336" y="150" width="16" height="48" rx="3"/><rect x="320" y="166" width="48" height="16" rx="3"/></g>
  <g fill="#1a2547" stroke="#24345f"><circle cx="500" cy="112" r="9"/><circle cx="522" cy="130" r="9"/><circle cx="478" cy="130" r="9"/><circle cx="500" cy="148" r="9"/></g>

  <!-- start -->
  <rect x="386" y="114" width="28" height="12" rx="6" fill="#111a33" stroke="#8a9bc4"/>

  <!-- labels -->
  <text x="120" y="52" class="s" text-anchor="end">Segurar LT: gravar</text>
  <text x="680" y="52" class="s">RT: atirar</text>
  <text x="120" y="82" class="s" text-anchor="end">LB: mina temporal</text>
  <text x="680" y="82" class="s">RB: invocar o eco</text>
  <text x="200" y="132" class="s" text-anchor="end">Stick esquerdo: mover</text>
  <text x="560" y="206" class="s">Stick direito: mirar</text>
  <text x="400" y="106" class="n" text-anchor="middle">START · PAUSAR</text>
  <text x="400" y="264" class="n" text-anchor="middle">OS BOTÕES PODEM SER TROCADOS NA TELA DE CONTROLES</text>
</svg>
