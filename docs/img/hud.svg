<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d">
  <title id="t">Mockup conceitual do HUD</title>
  <desc id="d">Integridade e memória temporal à esquerda, com 3,2 de 5,0 segundos gravados. Vida do chefe no topo, com indicação de vulnerabilidade. Pontuação e três espaços de eco à direita: eco 1 reproduzindo, ecos 2 e 3 disponíveis. Gadget equipado com recarga no canto inferior esquerdo e um aviso de combo no centro.</desc>
  <style>
    .n{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
    .v{font:700 28px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6ecff}
    .s{font:400 11.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".35"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="250" rx="14" fill="#070b17"/>
  <rect x="10" y="10" width="780" height="230" rx="12" fill="none" stroke="#36e2ff" stroke-opacity=".35"/>

  <!-- integrity -->
  <text x="30" y="36" class="n" fill="#3fe0a0">INTEGRIDADE</text>
  <rect x="30" y="44" width="180" height="10" rx="2" fill="#132245"/>
  <rect x="30" y="44" width="118" height="10" rx="2" fill="#3fe0a0"/>
  <g stroke="#070b17" stroke-width="2"><path d="M66 44V54M102 44V54M138 44V54M174 44V54"/></g>

  <!-- temporal memory -->
  <text x="30" y="86" class="n" fill="#ff4d6d">MEMÓRIA TEMPORAL</text>
  <rect x="30" y="94" width="220" height="10" rx="2" fill="#132245"/>
  <rect x="30" y="94" width="141" height="10" rx="2" fill="#ff4d6d"/>
  <text x="258" y="104" class="m" fill="#e6ecff">3,2 / 5,0 s</text>
  <circle cx="35" cy="124" r="4" fill="#ff4d6d"/>
  <text x="46" y="128" class="s" fill="#ff8fa3">SHIFT · gravando sequência</text>

  <!-- boss -->
  <text x="400" y="34" class="n" fill="#ff8a3d" text-anchor="middle">O GUARDIÃO DO CICLO</text>
  <rect x="290" y="42" width="220" height="8" rx="2" fill="#132245"/>
  <rect x="290" y="42" width="96" height="8" rx="2" fill="#ff8a3d"/>
  <rect x="356" y="58" width="88" height="18" rx="9" fill="#2a1016" stroke="#ff4d6d"/>
  <text x="400" y="71" class="n" fill="#ff4d6d" text-anchor="middle">VULNERÁVEL</text>

  <!-- score -->
  <text x="770" y="36" class="n" fill="#36e2ff" text-anchor="end">PONTUAÇÃO</text>
  <text x="770" y="68" class="v" text-anchor="end">012450</text>

  <!-- echoes -->
  <text x="770" y="104" class="n" fill="#b18cff" text-anchor="end">ECOS ATIVOS</text>
  <g>
    <rect x="458" y="114" width="100" height="52" rx="8" fill="#1c1640" stroke="#b18cff" stroke-width="1.5"/>
    <text x="470" y="134" class="s" fill="#e6ecff">Eco 01</text>
    <text x="470" y="152" class="m" fill="#b18cff">reproduzindo</text>
    <rect x="470" y="158" width="76" height="3" rx="1.5" fill="#132245"/><rect x="470" y="158" width="42" height="3" rx="1.5" fill="#b18cff"/>
    <rect x="564" y="114" width="100" height="52" rx="8" fill="#0f1830" stroke="#24345f"/>
    <text x="576" y="134" class="s" fill="#c9d4f2">Eco 02</text><text x="576" y="152" class="m" fill="#5d6f9e">disponível</text>
    <rect x="670" y="114" width="100" height="52" rx="8" fill="#0f1830" stroke="#24345f"/>
    <text x="682" y="134" class="s" fill="#c9d4f2">Eco 03</text><text x="682" y="152" class="m" fill="#5d6f9e">disponível</text>
  </g>

  <!-- gadget -->
  <rect x="30" y="152" width="56" height="56" rx="10" fill="#0f1830" stroke="#ffc94d"/>
  <circle cx="58" cy="180" r="9" fill="#ffc94d"/>
  <path d="M58 166V170M58 190V194M44 180H48M68 180H72" stroke="#ffc94d" stroke-width="2"/>
  <path d="M58 156 A24 24 0 1 1 34 180" fill="none" stroke="#ffc94d" stroke-width="3" stroke-opacity=".6"/>
  <text x="98" y="172" class="n" fill="#ffc94d">Q · MINA TEMPORAL</text>
  <text x="98" y="190" class="s" fill="#c9d4f2">recarregando</text>

  <!-- combo popup -->
  <circle cx="400" cy="178" r="70" fill="url(#glow)"/>
  <text x="400" y="176" text-anchor="middle" style="font:800 22px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.12em" fill="#ff8a3d">CROSSFIRE</text>
  <text x="400" y="196" class="n" text-anchor="middle" fill="#ffc9a1">NAVE + ECO NO MESMO ALVO</text>

  <text x="770" y="224" class="n" fill="#3a4a78" text-anchor="end">MOCKUP CONCEITUAL · NÃO É UMA INTERFACE IMPLEMENTADA</text>
</svg>
