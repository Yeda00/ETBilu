<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d">
  <title id="t">Dois modelos de progressão entre tentativas</title>
  <desc id="d">Modelo A, eco durante a vida, recomendado para o protótipo: o jogador grava e reproduz enquanto vive; a morte reinicia o encontro sem ecos. Modelo B, ciclos acumulados: ao reiniciar, a tentativa anterior vira um eco persistente que acompanha a nova.</desc>
  <style>
    .h{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
    .s{font:400 11.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d4f2}
    .n{font:700 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5d6f9e}
  </style>
  <defs>
    <path id="ship" d="M9 0 L-6 -6 L-3 0 L-6 6 Z"/>
    <g id="die"><path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#ff4d6d" stroke-width="2.5" stroke-linecap="round"/></g>
  </defs>
  <rect width="800" height="250" rx="14" fill="#0a0f1f"/>
  <rect x="10" y="10" width="385" height="230" rx="10" fill="#0f1830" stroke="#3fe0a0" stroke-opacity=".6"/>
  <rect x="405" y="10" width="385" height="230" rx="10" fill="#0f1830" stroke="#1e2b52"/>

  <!-- A -->
  <g transform="translate(10 10)">
    <text x="16" y="28" class="h" fill="#36e2ff">A · ECO DURANTE A VIDA</text>
    <rect x="262" y="14" width="108" height="20" rx="10" fill="#0d2a22" stroke="#3fe0a0"/>
    <text x="316" y="28" class="n" text-anchor="middle" fill="#3fe0a0">RECOMENDADO</text>

    <text x="16" y="64" class="n">TENTATIVA 1</text>
    <rect x="96" y="54" width="250" height="14" rx="7" fill="#132245"/>
    <rect x="96" y="54" width="200" height="14" rx="7" fill="#36e2ff" fill-opacity=".3"/>
    <g fill="#b18cff"><rect x="130" y="58" width="40" height="6" rx="3"/><rect x="200" y="58" width="40" height="6" rx="3"/></g>
    <use href="#die" x="304" y="61"/>

    <text x="16" y="104" class="n">TENTATIVA 2</text>
    <rect x="96" y="94" width="250" height="14" rx="7" fill="#132245"/>
    <rect x="96" y="94" width="250" height="14" rx="7" fill="#36e2ff" fill-opacity=".3"/>
    <g fill="#b18cff"><rect x="150" y="98" width="40" height="6" rx="3"/><rect x="230" y="98" width="40" height="6" rx="3"/><rect x="290" y="98" width="40" height="6" rx="3"/></g>
    <text x="352" y="105" class="n" fill="#3fe0a0">✓</text>

    <g fill="#b18cff"><rect x="16" y="140" width="22" height="6" rx="3"/></g><text x="46" y="147" class="s">eco gravado e reproduzido em vida</text>
    <use href="#die" x="27" y="168"/><text x="46" y="172" class="s">a morte reinicia o encontro, sem ecos</text>
    <text x="16" y="204" class="s" fill="#8a9bc4">Mais previsível e fácil de balancear.</text>
    <text x="16" y="220" class="s" fill="#8a9bc4">Sistema principal do protótipo.</text>
  </g>

  <!-- B -->
  <g transform="translate(405 10)">
    <text x="16" y="28" class="h" fill="#b18cff">B · CICLOS ACUMULADOS</text>
    <rect x="262" y="14" width="108" height="20" rx="10" fill="#151233" stroke="#5d6f9e"/>
    <text x="316" y="28" class="n" text-anchor="middle">EVOLUÇÃO FUTURA</text>

    <text x="16" y="64" class="n">TENTATIVA 1</text>
    <rect x="96" y="54" width="250" height="14" rx="7" fill="#132245"/>
    <rect x="96" y="54" width="170" height="14" rx="7" fill="#36e2ff" fill-opacity=".3"/>
    <use href="#die" x="274" y="61"/>

    <text x="16" y="104" class="n">TENTATIVA 2</text>
    <rect x="96" y="86" width="170" height="6" rx="3" fill="#b18cff" fill-opacity=".55"/>
    <rect x="96" y="96" width="250" height="14" rx="7" fill="#132245"/>
    <rect x="96" y="96" width="210" height="14" rx="7" fill="#36e2ff" fill-opacity=".3"/>
    <use href="#die" x="314" y="103"/>

    <text x="16" y="146" class="n">TENTATIVA 3</text>
    <rect x="96" y="120" width="170" height="6" rx="3" fill="#b18cff" fill-opacity=".35"/>
    <rect x="96" y="128" width="210" height="6" rx="3" fill="#b18cff" fill-opacity=".55"/>
    <rect x="96" y="138" width="250" height="14" rx="7" fill="#132245"/>
    <rect x="96" y="138" width="250" height="14" rx="7" fill="#36e2ff" fill-opacity=".3"/>
    <text x="352" y="149" class="n" fill="#3fe0a0">✓</text>

    <g fill="#b18cff" fill-opacity=".55"><rect x="16" y="166" width="22" height="6" rx="3"/></g><text x="46" y="173" class="s">a tentativa anterior vira um eco persistente</text>
    <text x="16" y="204" class="s" fill="#8a9bc4">"Tentar mais uma vez" como estrutura</text>
    <text x="16" y="220" class="s" fill="#8a9bc4">narrativa do jogo.</text>
  </g>
</svg>
