<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
  <title id="t">Arquitetura técnica sugerida para Unity</title>
  <desc id="d">PlayerController alimenta o TemporalRecorder, que guarda uma TemporalRecording; o EchoPlayback a reproduz numa EchoShip. O recorder separa movimento gravado e eventos de combate gravados, que vão para WeaponSystem e GadgetSystem. GadgetSystem leva ao DamageSystem; DamageSystem afeta inimigos e chefe; daí o ComboEvaluator e o feedback visual e sonoro.</desc>
  <style>
    .t{font:600 11.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6ecff}
    .g{font:700 9.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;fill:#5d6f9e}
  </style>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#121b36"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d6f9e"/></marker>
  </defs>
  <rect width="800" height="470" rx="14" fill="#0a0f1f"/>
  <rect width="800" height="470" rx="14" fill="url(#g)"/>

  <!-- group labels -->
  <text x="31" y="38" class="g">ENTRADA · GRAVAÇÃO · REPRODUÇÃO</text>
  <text x="31" y="155" class="g">DADOS GRAVADOS</text>
  <text x="31" y="245" class="g">SISTEMAS</text>
  <text x="31" y="335" class="g">MUNDO</text>
  <text x="31" y="425" class="g">AVALIAÇÃO</text>

  <!-- edges -->
  <g stroke="#5d6f9e" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M161 70H181"/><path d="M313 70H333"/><path d="M465 70H485"/><path d="M617 70H637"/>
    <path d="M248 90V128"/><path d="M276 90L376 128"/>
    <path d="M384 170L262 218"/><path d="M400 170V218"/>
    <path d="M465 240H485"/>
    <path d="M552 260V308"/>
    <path d="M487 330H248V398"/>
    <path d="M313 420H333"/>
  </g>

  <!-- row 1 -->
  <g>
    <rect x="31" y="50" width="130" height="40" rx="8" fill="#0d2633" stroke="#36e2ff"/>
    <text x="96" y="67" class="t" text-anchor="middle">Player</text><text x="96" y="82" class="t" text-anchor="middle">Controller</text>
    <rect x="183" y="50" width="130" height="40" rx="8" fill="#0d2633" stroke="#36e2ff"/>
    <text x="248" y="67" class="t" text-anchor="middle">Temporal</text><text x="248" y="82" class="t" text-anchor="middle">Recorder</text>
    <rect x="335" y="50" width="130" height="40" rx="8" fill="#0d2633" stroke="#36e2ff"/>
    <text x="400" y="67" class="t" text-anchor="middle">Temporal</text><text x="400" y="82" class="t" text-anchor="middle">Recording</text>
    <rect x="487" y="50" width="130" height="40" rx="8" fill="#1c1640" stroke="#b18cff"/>
    <text x="552" y="67" class="t" text-anchor="middle">Echo</text><text x="552" y="82" class="t" text-anchor="middle">Playback</text>
    <rect x="639" y="50" width="130" height="40" rx="8" fill="#1c1640" stroke="#b18cff" stroke-dasharray="5 3"/>
    <text x="704" y="67" class="t" text-anchor="middle">Echo</text><text x="704" y="82" class="t" text-anchor="middle">Ship</text>
  </g>
  <!-- row 2 -->
  <g fill="#151233" stroke="#b18cff" stroke-opacity=".6">
    <rect x="183" y="130" width="130" height="40" rx="8"/><rect x="335" y="130" width="130" height="40" rx="8"/>
  </g>
  <text x="248" y="147" class="t" text-anchor="middle">Recorded</text><text x="248" y="162" class="t" text-anchor="middle">Movement</text>
  <text x="400" y="147" class="t" text-anchor="middle">Recorded</text><text x="400" y="162" class="t" text-anchor="middle">Combat Events</text>
  <!-- row 3 -->
  <g fill="#111a33" stroke="#3a4a78">
    <rect x="183" y="220" width="130" height="40" rx="8"/><rect x="335" y="220" width="130" height="40" rx="8"/>
    <rect x="487" y="220" width="130" height="40" rx="8"/>
  </g>
  <text x="248" y="237" class="t" text-anchor="middle">Weapon</text><text x="248" y="252" class="t" text-anchor="middle">System</text>
  <text x="400" y="237" class="t" text-anchor="middle">Gadget</text><text x="400" y="252" class="t" text-anchor="middle">System</text>
  <text x="552" y="237" class="t" text-anchor="middle">Damage</text><text x="552" y="252" class="t" text-anchor="middle">System</text>
  <!-- row 4 -->
  <rect x="487" y="310" width="282" height="40" rx="8" fill="#22140f" stroke="#ff8a3d"/>
  <text x="628" y="334" class="t" text-anchor="middle">Enemies and Boss</text>
  <!-- row 5 -->
  <g fill="#0d2a22" stroke="#3fe0a0">
    <rect x="183" y="400" width="130" height="40" rx="8"/><rect x="335" y="400" width="130" height="40" rx="8"/>
  </g>
  <text x="248" y="417" class="t" text-anchor="middle">Combo</text><text x="248" y="432" class="t" text-anchor="middle">Evaluator</text>
  <text x="400" y="417" class="t" text-anchor="middle">Visual and Audio</text><text x="400" y="432" class="t" text-anchor="middle">Feedback</text>

  <text x="769" y="455" class="g" text-anchor="end">DIAGRAMA CONCEITUAL · GDD §13</text>
</svg>
